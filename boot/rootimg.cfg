# Where Linux keeps its files: an image file in the TI-Nspire file system.
# It is created on the first boot; delete it from the TI-Nspire file browser
# to start over (or to change its size).
image = /documents/linux/@IMAGE@
# Size of the image: "max" (all the free space, minus "reserve") or a size
# such as 32M. When there is not enough space, "max" is used instead.
size = max
# Space left to the TI-Nspire OS with "max"
reserve = 2M
